<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — QuizEngine</title>
    <meta name="description" content="Sign in to your QuizEngine account to access your quizzes and certificates." />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 40px;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 48px 44px;
            animation: fadeIn 0.5s ease;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .auth-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px;
            box-shadow: 0 8px 30px rgba(255, 122, 89, 0.25);
        }

        .auth-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--text-secondary);
            font-size: 0.92rem;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper input {
            padding-left: 44px;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            pointer-events: none;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--glass-border);
        }

        .admin-hint {
            background: rgba(244, 114, 182, 0.06);
            border: 1px solid rgba(244, 114, 182, 0.15);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            font-size: 0.82rem;
            color: #db2777;
            margin-bottom: 24px;
        }

        .admin-hint strong {
            color: var(--secondary);
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <div class="navbar-logo">🎯</div>
            <span class="navbar-title">QuizEngine</span>
        </a>
        <ul class="navbar-nav">
            <li><a href="/register" class="btn btn-secondary" style="padding:8px 20px">Register</a></li>
        </ul>
    </nav>

    <div class="auth-page">
        <div class="glass-card auth-card">

            <div class="auth-header">
                <div class="auth-logo">🎯</div>
                <h1>Welcome Back</h1>
                <p>Sign in to your account to continue</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-icon-wrapper">
                        <span class="input-icon">✉</span>
                        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-icon-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" placeholder="Enter your password" required
                            autocomplete="current-password" />
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%; margin-top:8px;">
                    Sign In &nbsp;→
                </button>
            </form>

            <div class="divider">or</div>

            <div class="auth-footer">
                Don't have an account? <a href="/register">Create one free</a>
            </div>

        </div>
    </div>

    <script src="/js/script.js"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    showToast(`Welcome back, ${data.name}! 🎉`, 'success');
                    setTimeout(() => {
                        window.location.href = data.role === 'admin' ? '/admin' : '/dashboard';
                    }, 1000);
                } else {
                    showToast(data.message || 'Login failed.', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Sign In →';
                }
            } catch (err) {
                showToast('Network error. Please try again.', 'error');
                btn.disabled = false;
                btn.textContent = 'Sign In →';
            }
        }
    </script>
</body>

</html>
