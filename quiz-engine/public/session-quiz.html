<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Session — QuizEngine</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        .quiz-page {
            min-height: 100vh;
            padding: 100px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ---- QUIZ SESSION HEADER ---- */
        .quiz-session-badge {
            background: rgba(255, 122, 89, 0.12);
            border: 1px solid rgba(255, 122, 89, 0.25);
            border-radius: 50px;
            padding: 5px 16px;
            font-size: 0.8rem;
            color: #ff9a7e;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* ---- TOP BAR ---- */
        .quiz-topbar {
            width: 100%;
            max-width: 780px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .quiz-meta {
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .quiz-meta span {
            color: var(--text-primary);
            font-weight: 600;
        }

        .timer-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 50px;
            padding: 8px 18px;
        }

        .timer-dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        .timer-text {
            font-weight: 700;
            font-size: 1rem;
            color: #f87171;
            font-variant-numeric: tabular-nums;
            min-width: 55px;
        }

        .timer-bar-wrapper {
            width: 100%;
            max-width: 780px;
            height: 4px;
            background: rgba(0, 0, 0, 0.03);
            border-radius: 2px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
            transition: width 1s linear, background 1s ease;
        }

        .progress-wrapper {
            width: 100%;
            max-width: 780px;
            margin-bottom: 12px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .progress-bar-track {
            height: 6px;
            background: rgba(0, 0, 0, 0.03);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 3px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ---- QUESTION CARD ---- */
        .question-card {
            width: 100%;
            max-width: 780px;
            padding: 40px;
            animation: fadeIn 0.4s ease;
        }

        .question-number {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.65;
            margin-bottom: 32px;
        }

        /* ---- OPTIONS ---- */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.02);
            border: 1.5px solid var(--glass-border);
            border-radius: 12px;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 0.92rem;
            font-weight: 500;
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        .option-label:hover {
            background: rgba(255, 122, 89, 0.06);
            border-color: rgba(255, 122, 89, 0.3);
            transform: translateY(-2px);
        }

        .option-label input[type="radio"] {
            display: none;
        }

        .option-radio {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid var(--glass-border);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }

        .option-radio::after {
            content: '';
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .option-label.selected {
            background: rgba(255, 122, 89, 0.08);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 122, 89, 0.08);
        }

        .option-label.selected .option-radio {
            border-color: var(--primary);
            background: var(--primary);
        }

        .option-label.selected .option-radio::after {
            opacity: 1;
        }

        .opt-key {
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--text-muted);
            min-width: 16px;
        }

        /* ---- NAV ---- */
        .quiz-nav {
            width: 100%;
            max-width: 780px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .question-dots {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }

        .q-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.08);
            transition: all var(--transition);
            cursor: pointer;
        }

        .q-dot.active {
            background: var(--primary);
            transform: scale(1.3);
        }

        .q-dot.answered {
            background: var(--success);
        }

        #loadingState {
            text-align: center;
            padding: 60px 0;
            color: var(--text-secondary);
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }

            .question-card {
                padding: 24px 16px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <div class="navbar-logo">🎯</div>
            <span class="navbar-title">QuizEngine</span>
        </a>
        <ul class="navbar-nav">
            <li id="quizTitleNav" style="color:var(--text-secondary); font-size:0.88rem;"></li>
            <li><a href="#" class="btn btn-secondary" style="padding:8px 20px" onclick="confirmLeave()">Leave</a></li>
        </ul>
    </nav>

    <div class="quiz-page">

        <!-- Session badge -->
        <div class="quiz-session-badge" id="sessionBadge">Loading session...</div>

        <!-- Loading -->
        <div id="loadingState">
            <div class="spinner" style="margin:0 auto 16px;"></div>
            <p>Loading quiz session...</p>
        </div>

        <!-- Quiz UI -->
        <div id="quizContainer" style="display:none; flex-direction:column; align-items:center; width:100%;">

            <div class="quiz-topbar">
                <div class="quiz-meta">Question <span id="currentQ">1</span> of <span id="totalQ">?</span></div>
                <div class="timer-wrapper">
                    <div class="timer-dot"></div>
                    <span class="timer-text" id="timerDisplay">10:00</span>
                </div>
            </div>

            <div class="timer-bar-wrapper">
                <div class="timer-bar" id="timerBar" style="width:100%"></div>
            </div>

            <div class="progress-wrapper">
                <div class="progress-label">
                    <span id="answeredCount">0 answered</span>
                    <span id="progressPct">0%</span>
                </div>
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
                </div>
            </div>

            <div class="glass-card question-card" id="questionCard">
                <div class="question-number" id="qNumLabel">QUESTION 1</div>
                <div class="question-text" id="questionText"></div>
                <div class="options-grid" id="optionsGrid"></div>
            </div>

            <div class="quiz-nav">
                <button class="btn btn-secondary" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
                <div class="question-dots" id="questionDots"></div>
                <button class="btn btn-primary" id="nextBtn" onclick="navigate(1)">Next →</button>
            </div>

            <button class="btn btn-success" id="submitBtn" onclick="submitQuiz()"
                style="margin-top:24px; display:none; padding:14px 48px; font-size:1rem;">
                Submit Quiz ✓
            </button>
        </div>

    </div>

    <script src="/js/script.js"></script>
    <script src="/js/session-quiz.js"></script>
</body>

</html>
