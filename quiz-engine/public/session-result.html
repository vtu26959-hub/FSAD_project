<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session Result — QuizEngine</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        .result-page {
            min-height: 100vh;
            padding: 100px 20px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .result-card {
            width: 100%;
            max-width: 560px;
            padding: 48px 44px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .score-circle {
            width: 160px;
            height: 160px;
            margin: 0 auto 32px;
            position: relative;
        }

        .score-svg {
            transform: rotate(-90deg);
        }

        .score-track {
            fill: none;
            stroke: rgba(0, 0, 0, 0.06);
            stroke-width: 12;
        }

        .score-fill {
            fill: none;
            stroke-width: 12;
            stroke-linecap: round;
            transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .score-fill.pass {
            stroke: url(#passGrad);
        }

        .score-fill.fail {
            stroke: #ef4444;
        }

        .score-inner {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .score-pct {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1;
        }

        .score-pct.pass {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score-pct.fail {
            color: #f87171;
        }

        .score-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 22px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
        }

        .status-badge.pass {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .status-badge.fail {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .result-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .result-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 32px;
        }

        .stats-row {
            display: flex;
            justify-content: center;
            gap: 0;
            margin-bottom: 36px;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .stat-box {
            flex: 1;
            padding: 20px 16px;
            text-align: center;
            border-right: 1px solid var(--glass-border);
        }

        .stat-box:last-child {
            border-right: none;
        }

        .stat-box .num {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .stat-box .lbl {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .stat-box .num.correct {
            color: #34d399;
        }

        .stat-box .num.wrong {
            color: #f87171;
        }

        .stat-box .num.total {
            color: var(--primary);
        }

        .cert-note {
            background: rgba(255, 122, 89, 0.08);
            border: 1px solid rgba(255, 122, 89, 0.2);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            font-size: 0.88rem;
            color: #e85d3a;
            margin-bottom: 28px;
        }

        .cert-id {
            display: inline-block;
            background: #FAFAF9;
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            padding: 2px 10px;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            word-break: break-all;
            margin-top: 6px;
        }

        .result-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .session-info-box {
            background: rgba(255, 122, 89, 0.05);
            border: 1px solid rgba(255, 122, 89, 0.12);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        /* Confetti */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9990;
            overflow: hidden;
        }

        .confetti-piece {
            position: absolute;
            top: -12px;
            border-radius: 2px;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-10px) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <div class="navbar-logo">🎯</div>
            <span class="navbar-title">QuizEngine</span>
        </a>
        <ul class="navbar-nav">
            <li><a href="/dashboard" class="btn btn-secondary" style="padding:8px 20px">Dashboard</a></li>
        </ul>
    </nav>

    <!-- Confetti -->
    <div class="confetti-container" id="confettiContainer"></div>

    <div class="result-page">
        <div class="glass-card result-card">

            <div class="score-circle">
                <svg width="160" height="160" class="score-svg">
                    <defs>
                        <linearGradient id="passGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#FF7A59" />
                            <stop offset="100%" stop-color="#F472B6" />
                        </linearGradient>
                    </defs>
                    <circle class="score-track" cx="80" cy="80" r="68" />
                    <circle class="score-fill" cx="80" cy="80" r="68" id="scoreArc" stroke-dasharray="427"
                        stroke-dashoffset="427" />
                </svg>
                <div class="score-inner">
                    <div class="score-pct" id="scorePct">0%</div>
                    <div class="score-label">Score</div>
                </div>
            </div>

            <div id="statusBadge" class="status-badge"><span id="statusIcon">⏳</span> <span
                    id="statusText">Loading...</span></div>

            <!-- Session info -->
            <div class="session-info-box" id="sessionInfoBox" style="display:none;"></div>

            <h1 class="result-title" id="resultTitle">Quiz Complete</h1>
            <p class="result-subtitle" id="resultSubtitle">Here are your results</p>

            <div class="stats-row">
                <div class="stat-box">
                    <div class="num total" id="totalQNum">—</div>
                    <div class="lbl">Total</div>
                </div>
                <div class="stat-box">
                    <div class="num correct" id="correctNum">—</div>
                    <div class="lbl">Correct</div>
                </div>
                <div class="stat-box">
                    <div class="num wrong" id="wrongNum">—</div>
                    <div class="lbl">Wrong</div>
                </div>
            </div>

            <div class="cert-note" id="certNote" style="display:none;">
                🎉 Congratulations! Your certificate has been generated.
                <br>
                <div class="cert-id" id="certIdDisplay"></div>
            </div>

            <div class="cert-note" id="failNote"
                style="display:none; background:rgba(239,68,68,0.06); border-color:rgba(239,68,68,0.15); color:#f87171;">
                😔 You need 60% to pass. Ask the host to create a new session to try again!
            </div>

            <div class="result-actions">
                <a href="/dashboard" class="btn btn-secondary">🏠 Dashboard</a>
                <a href="#" class="btn btn-primary" id="downloadCertBtn" style="display:none;" onclick="downloadCert()">
                    📜 Download Certificate
                </a>
            </div>
        </div>
    </div>

    <script src="/js/script.js"></script>
    <script>
        let resultData = null;

        function animateScore(pct) {
            const arc = document.getElementById('scoreArc');
            const el = document.getElementById('scorePct');
            const offset = 427 - (pct / 100) * 427;
            arc.classList.add(pct >= 60 ? 'pass' : 'fail');
            el.classList.add(pct >= 60 ? 'pass' : 'fail');
            setTimeout(() => { arc.style.strokeDashoffset = offset; }, 200);
            let cur = 0;
            const step = pct / 60;
            const iv = setInterval(() => {
                cur = Math.min(cur + step, pct);
                el.textContent = Math.round(cur) + '%';
                if (cur >= pct) clearInterval(iv);
            }, 16);
        }

        function showConfetti() {
            const container = document.getElementById('confettiContainer');
            const colors = ['#FF7A59', '#F472B6', '#FACC15', '#10b981', '#f59e0b', '#ec4899'];
            for (let i = 0; i < 120; i++) {
                const p = document.createElement('div');
                p.className = 'confetti-piece';
                const size = Math.random() * 10 + 6;
                p.style.cssText = `width:${size}px;height:${size * (Math.random() > 0.5 ? 1 : 2.5)}px;left:${Math.random() * 100}%;background:${colors[Math.floor(Math.random() * colors.length)]};animation-duration:${Math.random() * 2 + 2}s;animation-delay:${Math.random() * 1.5}s;border-radius:${Math.random() > 0.5 ? '50%' : '2px'};`;
                container.appendChild(p);
            }
            setTimeout(() => container.innerHTML = '', 5000);
        }

        function renderResult(data) {
            resultData = data;
            const pct = parseFloat(data.percentage);
            const wrong = data.total - data.score;

            document.getElementById('totalQNum').textContent = data.total;
            document.getElementById('correctNum').textContent = data.score;
            document.getElementById('wrongNum').textContent = wrong;

            animateScore(pct);

            // Session info
            if (data.quizTitle || data.joinCode) {
                const box = document.getElementById('sessionInfoBox');
                box.style.display = 'block';
                box.textContent = `📋 ${data.quizTitle || 'Quiz Session'} — Code: ${data.joinCode || ''}`;
            }

            const badge = document.getElementById('statusBadge');
            if (data.passed) {
                badge.classList.add('pass');
                document.getElementById('statusIcon').textContent = '✅';
                document.getElementById('statusText').textContent = 'PASSED';
                document.getElementById('resultTitle').textContent = `Well done, ${data.userName || 'you'}!`;
                document.getElementById('resultSubtitle').textContent = 'You passed and earned a certificate.';
                document.getElementById('certNote').style.display = 'block';
                document.getElementById('certIdDisplay').textContent = data.certificateId;
                document.getElementById('downloadCertBtn').style.display = 'inline-flex';
                setTimeout(showConfetti, 500);
            } else {
                badge.classList.add('fail');
                document.getElementById('statusIcon').textContent = '❌';
                document.getElementById('statusText').textContent = 'FAILED';
                document.getElementById('resultTitle').textContent = 'Almost There!';
                document.getElementById('resultSubtitle').textContent = "You didn't reach the 60% passing threshold.";
                document.getElementById('failNote').style.display = 'block';
            }
        }

        function downloadCert() {
            if (resultData?.certificateId) {
                window.location.href = `/api/session/certificate/${resultData.certificateId}`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const stored = sessionStorage.getItem('sessionResult');
            if (stored) {
                renderResult(JSON.parse(stored));
                sessionStorage.removeItem('sessionResult');
            } else {
                showToast('No result found.', 'warning');
                setTimeout(() => window.location.href = '/dashboard', 2000);
            }
        });
    </script>
</body>

</html>
